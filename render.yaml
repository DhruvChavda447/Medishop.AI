services:
  - type: web
    name: medicare-ai-rag
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && gunicorn medishop_proj.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-ai-db
          property: connectionString

databases:
  - name: medicare-ai-db
    plan: free
    databaseName: medicare_db
    user: medicare_user
